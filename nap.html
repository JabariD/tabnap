<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TabNap - Sleeping</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            cursor: pointer;
            user-select: none;
        }
        .container {
            text-align: center;
            max-width: 80%;
        }
        .icon {
            width: 96px;
            height: 96px;
            margin-bottom: 24px;
            display: inline-block;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.05);
            padding: 12px;
            transition: opacity 0.3s ease;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            color: #9aa0a6;
            margin: 0;
        }
        .url {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #5f6368;
            word-break: break-all;
        }
        .hint {
            margin-top: 40px;
            font-size: 14px;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="favicon" class="icon" src="" style="display: none;">
        <h1 id="title">This tab is napping</h1>
        <p>It's frozen to save memory and CPU.</p>
        <div id="url" class="url"></div>
        <div class="hint">Click anywhere to wake it up</div>
    </div>
    <script src="nap.js"></script>
</body>
</html>
